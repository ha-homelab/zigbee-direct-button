name: Accept approved bot invitation once
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  accept:
    if: >-
      github.repository == 'ha-homelab/zigbee-direct-button' &&
      github.event.pull_request.draft &&
      github.event.pull_request.user.login == '4alvit' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/protected-bot-automerge-20261009'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Accept only the explicitly approved repository invitation
        shell: python3 -I {0}
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          import json
          import subprocess

          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path], text=True))

          assert api('user')['login'] == 'californiantiramisu'
          repo = 'ha-homelab/zigbee-direct-button'
          pages = json.loads(subprocess.check_output(
              ['gh', 'api', '--paginate', '--slurp', 'user/repository_invitations?per_page=100'], text=True))
          matches = [item for page in pages for item in page
                     if item['id'] == 337015449
                     and item['repository']['id'] == 1410999567
                     and item['repository']['full_name'] == repo
                     and item['invitee']['login'] == 'californiantiramisu'
                     and item['inviter']['login'] == '4alvit'
                     and item['permissions'] == 'write']
          if matches:
              assert len(matches) == 1
              subprocess.run(['gh', 'api', '--method', 'PATCH',
                              'user/repository_invitations/337015449'], check=True)
          assert api('repos/' + repo)['permissions']['push'] is True
          print('Approved bot has write access to the intended repository.')
