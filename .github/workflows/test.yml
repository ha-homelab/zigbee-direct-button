name: Host tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/change-scope.yml@d4b21d156067ce58f89f89149bfad545e1889ae7 # main
    with:
      force-full: false
      documentation-paths: "[\"GOVERNANCE.md\", \"ROADMAP.md\"]"
  test:
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sanitizers: ["", "address,undefined"]
    env:
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - run: python -m ruff check --isolated --ignore-noqa --select E9,F63,F7,F82 .
      - name: Build shared C firmware with host instrumentation
        env:
          SANITIZERS: ${{ matrix.sanitizers }}
        run: make -j2 stub/build stub/build_end_device HOST_CC=clang SANITIZERS="$SANITIZERS"
      - run: python -m pytest tests/ -q -W error
      - name: Validate deployment example and scripts
        run: |
          bash -n scripts/build.sh
          python -m py_compile scripts/check_ota.py scripts/make_ota_index.py examples/home-assistant/tuya_direct_button.py
      - name: Test documentation-scope gate contracts
        run: python3 .github/workflow-tests/test_docs_scope.py
  container:
    if: ${{ needs.scope.outputs.run == 'true' }}
    needs: ["scope"]
    name: Packaged Python runtime
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the shipped development image
        run: docker build --tag zigbee-button-ci .
      - name: Exercise firmware host builds and tests in the packaged runtime
        run: >-
          docker run --rm --network none --cap-drop ALL
          --security-opt no-new-privileges zigbee-button-ci
          bash -e -c 'make -j2 stub/build stub/build_end_device && python -m pytest tests/ -q -W error'

  firmware:
    if: ${{ needs.scope.outputs.run == 'true' }}
    needs: ["scope"]
    name: Native TS0041 firmware
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the actual target on native x86_64
        run: |
          test "$(uname -m)" = x86_64
          mkdir -p output
          chmod g+w output
          docker build --tag zigbee-button-firmware .
          docker run --rm --cap-drop ALL --security-opt no-new-privileges \
            --group-add "$(id -g)" \
            --env TAR_OPTIONS=--no-same-owner \
            --mount "type=bind,source=$PWD/output,target=/output" zigbee-button-firmware
      - name: Bind the public artifacts to this source and build
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            zigbee-button-firmware python3 -c \
            'import json,platform; print(json.dumps({"os": platform.system(), "architecture": platform.machine(), "python": platform.python_version()}))' \
            > "$RUNNER_TEMP/firmware-runtime.json"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          sys.path.insert(0, "scripts")
          from check_ota import inspect_artifact_pair

          output = Path("output")
          image = output / "ts0041-hold-off-1.1.3.2.zigbee"
          binary = output / "ts0041-hold-off-1.1.3.2.bin"
          metadata = inspect_artifact_pair(binary.read_bytes(), image.read_bytes())
          provenance = json.loads(Path("PROVENANCE.json").read_text())
          metadata["build"] = {
              "sourceCommit": os.environ["SOURCE_COMMIT"],
              "sourceTree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "sourceRepository": os.environ["SOURCE_REPOSITORY"],
              "workflowRun": os.environ["WORKFLOW_RUN"],
              "containerImage": subprocess.check_output(
                  ["docker", "image", "inspect", "--format", "{{.Id}}", "zigbee-button-firmware"],
                  text=True,
              ).strip(),
              "containerBase": Path("Dockerfile").read_text().splitlines()[0].removeprefix("FROM "),
              "runtime": json.loads((Path(os.environ["RUNNER_TEMP"]) / "firmware-runtime.json").read_text()),
              "sdkArchiveSha256": provenance["build"]["sdk_archive_sha256"],
              "compilerArchiveSha256": provenance["build"]["compiler_sha256"],
              "provenanceSha256": hashlib.sha256(Path("PROVENANCE.json").read_bytes()).hexdigest(),
          }
          # Docker owns its output files; replace through the runner-owned directory.
          metadata_temp = output / ".metadata.json"
          metadata_temp.write_text(json.dumps(metadata, indent=2) + "\n")
          metadata_temp.replace(output / "metadata.json")
          names = [binary.name, image.name, "metadata.json"]
          sums_temp = output / ".SHA256SUMS"
          sums_temp.write_text("".join(
              f"{hashlib.sha256((output / name).read_bytes()).hexdigest()}  {name}\n" for name in names
          ))
          sums_temp.replace(output / "SHA256SUMS")
          PY
          (cd output && sha256sum -c SHA256SUMS)
      - name: Upload only the verified public firmware files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ts0041-firmware-${{ github.sha }}
          path: |
            output/ts0041-hold-off-1.1.3.2.bin
            output/ts0041-hold-off-1.1.3.2.zigbee
            output/metadata.json
            output/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  gate:
    name: CI gate
    needs: ["container", "firmware", "scope", "test"]
    if: ${{ always() }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Require the exact selected validation path
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: python3 {0}
        run: |
          import json, os
          results = json.loads(os.environ['RESULTS'])
          expected = ['container', 'firmware', 'scope', 'test']
          always = ['scope', 'test']
          if set(results) != set(expected):
              raise SystemExit('Validation job inventory differs')
          scope = results['scope']
          outputs = scope.get('outputs', {})
          run = outputs.get('run')
          if scope['result'] != 'success' or run not in {'true', 'false'}:
              raise SystemExit('Change scope did not succeed')
          if run == 'false' and outputs.get('reason') != 'documentation-only':
              raise SystemExit('Unproven documentation-only scope')
          failed = {}
          for name, value in results.items():
              wanted = 'success' if run == 'true' or name in always else 'skipped'
              if value['result'] != wanted:
                  failed[name] = {'actual': value['result'], 'expected': wanted}
          if failed:
              raise SystemExit(f'Validation did not pass: {failed}')
