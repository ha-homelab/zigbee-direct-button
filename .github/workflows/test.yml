name: Host tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: make stub/build stub/build_end_device
      - run: python -m pytest tests/ -q
      - name: Validate deployment example and scripts
        run: |
          bash -n scripts/build.sh
          python -m py_compile scripts/check_ota.py scripts/make_ota_index.py examples/home-assistant/tuya_direct_button.py
