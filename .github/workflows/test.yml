name: Host tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sanitizers: ["", "address,undefined"]
    env:
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check --isolated --ignore-noqa --select E9,F63,F7,F82 .
      - name: Build shared C firmware with host instrumentation
        env:
          SANITIZERS: ${{ matrix.sanitizers }}
        run: make -j2 stub/build stub/build_end_device HOST_CC=clang SANITIZERS="$SANITIZERS"
      - run: python -m pytest tests/ -q -W error
      - name: Validate deployment example and scripts
        run: |
          bash -n scripts/build.sh
          python -m py_compile scripts/check_ota.py scripts/make_ota_index.py examples/home-assistant/tuya_direct_button.py

  container:
    name: Packaged Python runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build the shipped development image
        run: docker build --tag zigbee-button-ci .
      - name: Exercise firmware host builds and tests in the packaged runtime
        run: >-
          docker run --rm --network none --cap-drop ALL
          --security-opt no-new-privileges zigbee-button-ci
          bash -e -c 'make -j2 stub/build stub/build_end_device && python -m pytest tests/ -q -W error'

  gate:
    name: CI gate
    needs: [test, container]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Require successful host tests
        env:
          TEST_RESULT: ${{ needs.test.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: test "$TEST_RESULT" = success && test "$CONTAINER_RESULT" = success
